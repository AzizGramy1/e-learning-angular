<div class="min-h-screen bg-gray-100 flex flex-col">
  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">Planning - EduTech</h1>
      <button
        (click)="isModalOpen = true"
        class="bg-white text-indigo-600 px-4 py-2 rounded-lg shadow hover:bg-gray-200 transition duration-300"
      >
        Ajouter un évènement
      </button>
    </div>
  </header>

  <!-- Calendrier -->
  <main class="flex-1 container mx-auto p-4">
    <full-calendar
      #calendar
      [options]="calendarOptions"
      class="bg-white rounded-xl shadow-lg p-6 animate-fadeIn"
    ></full-calendar>
  </main>

  <!-- Modal -->
  <div
    *ngIf="isModalOpen"
    class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 animate-fadeIn"
  >
    <div
      class="bg-white rounded-lg shadow-xl w-96 p-6 transform transition-all scale-95 animate-fadeIn"
    >
      <h2 class="text-xl font-bold mb-4">Ajouter un évènement</h2>
      <form (ngSubmit)="addEvent()">
        <label class="block mb-2 text-sm font-medium text-gray-700">
          Titre
        </label>
        <input
          [(ngModel)]="newEvent.title"
          name="title"
          type="text"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4"
          required
        />

        <label class="block mb-2 text-sm font-medium text-gray-700">
          Date
        </label>
        <input
          [(ngModel)]="newEvent.date"
          name="date"
          type="date"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4"
          required
        />

        <div class="flex justify-end gap-2">
          <button
            type="button"
            (click)="closeModal()"
            class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 transition duration-300"
          >
            Annuler
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-300"
          >
            Ajouter
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
