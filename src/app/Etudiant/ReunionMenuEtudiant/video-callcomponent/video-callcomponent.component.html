<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle de Réunion - EduConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- OpenVidu Browser SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openvidu-browser/2.29.1/openvidu-browser-2.29.1.min.js"></script>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #2563EB;
        --primary-dark: #1E40AF;
        --secondary: #059669;
        --danger: #DC2626;
        --dark: #0F172A;
        --darker: #020617;
        --light: #FFFFFF;
        --gray: #E2E8F0;  
        --gray-light: #9ca3af;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
        color: #e6e6e6;
        min-height: 100vh;
        overflow: hidden;
        line-height: 1.6;
    }

    .meeting-room {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 20px;
        gap: 20px;
    }

    .meeting-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 15px;
        padding: 15px 25px;
        border: 1px solid rgba(236, 231, 231, 0.3);
    }

    .meeting-info h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 5px;
        color: var(--light);
    }

    .meeting-status {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .status-indicator {
        display: flex;
        align-items: center;
        padding: 8px 15px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--danger), #B91C1C);
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        animation: pulseGlow 2s infinite;
    }

    .participants-count {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--gray-light); 
        font-weight: 500;
    }

    .timer {
        color: var(--light); 
        font-weight: 600;
        font-size: 1.1rem;
    }

    .meeting-content {
        display: flex;
        flex: 1;
        gap: 20px;
        min-height: 0;
    }

    .main-stream-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .main-stream {
        flex: 1;
        background: rgba(30, 41, 59, 0.9);
        border-radius: 15px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(37, 99, 235, 0.5);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .main-stream video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 15px;
    }

    .main-stream-pinned {
        position: absolute;
        top: 15px;
        left: 15px;
        background: rgba(0, 0, 0, 0.8);
        color: var(--light);
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 5px;
        z-index: 10;
    }

    .stream-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 15px;
        background: linear-gradient(135deg, #1E293B, #334155);
        color: var(--light);
    }

    .stream-content i {
        font-size: 4rem;
        color: var(--primary);
    }

    .stream-info {
        text-align: center;
    }

    .stream-info h2 {
        font-size: 1.8rem;
        margin-bottom: 5px;
        color: var(--light);
    }

    .stream-info p {
        color: var(--gray-light); 
    }

    .stream-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .participant-name {
        font-weight: 600;
        font-size: 1.2rem;
        color: #fff;
    }

    .participant-status {
        display: flex;
        gap: 15px;
    }

    .status-icon {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }

    .status-muted {
        background: var(--danger);
    }

    .status-speaking {
        background: var(--secondary);
        animation: pulse 1s infinite;
    }

    .participants-thumbnails {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        max-height: 180px;
        overflow-x: auto;
        padding: 10px;
    }

    .thumbnail-item {
        background: rgba(249, 250, 251, 0.9);
        border-radius: 10px;
        overflow: hidden;
        aspect-ratio: 16/9;
        position: relative;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }

    .thumbnail-item:hover {
        transform: translateY(-5px);
        border-color: rgba(37, 99, 235, 0.5);
    }

    .thumbnail-item video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .thumbnail-placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1E293B, #334155);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .thumbnail-placeholder i {
        font-size: 1.5rem;
        color: var(--gray-light); 
    }

    .thumbnail-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
    }

    .thumbnail-name {
        font-weight: 500;
        color: #fff;
    }

    .sidebar {
        width: 350px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .controls-container {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(20px);
        border-radius: 15px;
        padding: 20px;
        border: 1px solid rgba(239, 235, 235, 0.15);
    }

    .controls-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .control-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 15px 10px;
        background: rgba(242, 242, 243, 0.8);
        border: none;
        border-radius: 10px;
        color: #e6e6e6;
        cursor: pointer;
        transition: all 0.3s ease;
        gap: 8px;
    }

    .control-btn:hover {
        background: rgb(235, 237, 241);
        transform: translateY(-2px);
    }

    .control-btn.active {
        background: rgba(37, 99, 235, 0.4);
        color: #fff;
    }

    .control-btn.danger {
        background: rgba(255, 254, 254, 0.4);
        color: #fff;
    }

    .control-btn.danger:hover {
        background: rgba(220, 38, 38, 0.6);
    }

    .control-icon {
        font-size: 1.2rem;
        color: #fff;
    }

    .control-label {
        font-size: 0.8rem;
        font-weight: 500;
        color: #e6e6e6;
    }

    .chat-container {
        flex: 1;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(20px);
        border-radius: 15px;
        padding: 20px;
        border: 1px solid rgba(246, 240, 240, 0.948);
        display: flex;
        flex-direction: column;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(243, 239, 239, 0.958);
    }

    .chat-header h3 {
        color: #fff;
        font-weight: 600;
    }

    .unread-count {
        background: var(--primary);
        color: white;
        padding: 3px 8px;
        border-radius: 10px;
        font-size: 0.8rem;
        font-weight: 500;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 15px;
    }

    .chat-message {
        display: flex;
        gap: 10px;
        animation: slideInRight 0.3s ease-out;
        color: #e6e6e6;
    }

    .message-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        object-fit: cover;
    }

    .message-content {
        background: rgba(37, 99, 235, 0.3);
        padding: 10px 15px;
        border-radius: 15px;
        max-width: 80%;
    }

    .message-sender {
        font-weight: 600;
        margin-bottom: 5px;
        color: #fff;
    }

    .message-content div:not(.message-sender):not(.message-time) {
        color: var(--gray-light);
    }

    .message-time {
        font-size: 0.7rem;
        color: var(--gray-light);
        margin-top: 5px;
    }

    .chat-input {
        display: flex;
        gap: 10px;
    }

    .chat-input input {
        flex: 1;
        padding: 12px 15px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(239, 230, 230, 0.1);
        border-radius: 10px;
        color: #e6e6e6;
        outline: none;
        transition: all 0.3s ease;
    }

    .chat-input input:focus {
        border-color: var(--primary);
    }

    .chat-input input::placeholder {
        color: var(--gray-light);
    }

    .chat-input button {
        padding: 12px 20px;
        background: var(--primary);
        border: none;
        border-radius: 10px;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .chat-input button:hover {
        background: var(--primary-dark);
    }

    .participants-list {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(20px);
        border-radius: 15px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        max-height: 200px;
        overflow-y: auto;
    }

    .participants-list h4 {
        margin-bottom: 15px;
        color: #fff;
        font-weight: 600;
    }

    .participant-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid rgb(255, 255, 255);
        color: #e6e6e6;
    }

    .participant-item:last-child {
        border-bottom: none;
        color: var(--gray-light);
        font-style: italic;
    }

    .participant-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        object-fit: cover;
    }

    .fa-users, .fa-circle, .fa-microphone, .fa-video, .fa-comments, .fa-desktop, .fa-phone-slash, .fa-thumbtack, .fa-user-tie, .fa-user {
        color: var(--gray-light) !important;
    }

    .connection-status {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 15px;
        border-radius: 10px;
        font-weight: 600;
        z-index: 1000;
        transition: all 0.3s ease;
    }

    .connection-status.connecting {
        background: rgba(251, 191, 36, 0.9);
        color: #000;
    }

    .connection-status.connected {
        background: rgba(5, 150, 105, 0.9);
        color: #fff;
    }

    .connection-status.error {
        background: rgba(220, 38, 38, 0.9);
        color: #fff;
    }

    @keyframes pulseGlow {
        0% {
            box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
        }
        70% {
            box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
        }
        100% {
            box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
        }
    }

    @keyframes pulse {
        0% {
            opacity: 1;
        }
        50% {
            opacity: 0.5;
        }
        100% {
            opacity: 1;
        }
    }

    @keyframes slideInRight {
        from {
            opacity: 0;
            transform: translateX(20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    ::-webkit-scrollbar {
        width: 6px;
    }

    ::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.5);
        border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 3px;
    }

    @media (max-width: 1024px) {
        .meeting-content {
            flex-direction: column;
        }
        
        .sidebar {
            width: 100%;
            flex-direction: row;
        }
        
        .participants-list {
            flex: 1;
            max-height: 150px;
        }
        
        .participants-thumbnails {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            max-height: 150px;
        }
    }

    @media (max-width: 768px) {
        .meeting-room {
            padding: 10px;
            gap: 10px;
        }
        
        .controls-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .sidebar {
            flex-direction: column;
        }
        
        .participants-thumbnails {
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            max-height: 120px;
        }
        
        .stream-info h2 {
            font-size: 1.4rem;
        }
    }
</style>

<body>
    <div class="connection-status" id="connectionStatus">Connexion en cours...</div>
    
    <div class="meeting-room">
        <div class="meeting-header">
            <div class="meeting-info">
                <h1>Machine Learning Avancé - Session Pratique</h1>
                <div class="meeting-status">
                    <div class="status-indicator">
                        <i class="fas fa-circle mr-2"></i> EN DIRECT
                    </div>
                    <div class="participants-count">
                        <i class="fas fa-users"></i>
                        <span id="participantCount">1 participant</span>
                    </div>
                </div>
            </div>
            <div class="timer" id="timer">00:00:00</div>
        </div>

        <div class="meeting-content">
            <div class="main-stream-container">
                <div class="main-stream" id="mainStream">
                    <div class="main-stream-pinned">
                        <i class="fas fa-thumbtack"></i> Vous
                    </div>
                    <div class="stream-content" id="streamContent">
                        <i class="fas fa-user-tie"></i>
                        <div class="stream-info">
                            <h2>En attente de la caméra...</h2>
                            <p>Autorisation requise</p>
                        </div>
                    </div>
                    <div class="stream-overlay">
                        <span class="participant-name">Vous</span>
                        <div class="participant-status">
                            <div class="status-icon status-speaking"></div>
                            <i class="fas fa-microphone" style="color: var(--secondary);"></i>
                        </div>
                    </div>
                </div>
                
                <div class="participants-thumbnails" id="participantThumbnails">
                    <!-- Les miniatures des autres participants apparaîtront ici -->
                </div>
            </div>

            <div class="sidebar">
                <div class="controls-container">
                    <div class="controls-grid">
                        <button class="control-btn active" id="micBtn">
                            <i class="fas fa-microphone control-icon"></i>
                            <span class="control-label">Micro</span>
                        </button>
                        <button class="control-btn active" id="videoBtn">
                            <i class="fas fa-video control-icon"></i>
                            <span class="control-label">Caméra</span>
                        </button>
                        <button class="control-btn" id="screenBtn">
                            <i class="fas fa-desktop control-icon"></i>
                            <span class="control-label">Partage</span>
                        </button>
                        <button class="control-btn" id="chatBtn">
                            <i class="fas fa-comments control-icon"></i>
                            <span class="control-label">Chat</span>
                        </button>
                        <button class="control-btn" id="participantsBtn">
                            <i class="fas fa-users control-icon"></i>
                            <span class="control-label">Participants</span>
                        </button>
                        <button class="control-btn danger" id="leaveBtn">
                            <i class="fas fa-phone-slash control-icon"></i>
                            <span class="control-label">Quitter</span>
                        </button>
                    </div>
                </div>

                <div class="chat-container">
                    <div class="chat-header">
                        <h3>Chat de la réunion</h3>
                        <span class="unread-count" id="unreadCount">0</span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages du chat -->
                    </div>
                    <div class="chat-input">
                        <input type="text" placeholder="Tapez votre message..." id="chatInput">
                        <button id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <div class="participants-list">
                    <h4>Participants (<span id="participantListCount">1</span>)</h4>
                    <div id="participantsList">
                        <div class="participant-item">
                            <div class="participant-avatar" style="background: var(--primary); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-user" style="color: white;"></i>
                            </div>
                            <span>Vous</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Configuration OpenVidu - À adapter selon votre serveur
    const OPENVIDU_SERVER_URL = 'https://localhost:4443'; // Remplacez par l'URL de votre serveur OpenVidu
    const OPENVIDU_SERVER_SECRET = 'MY_SECRET'; // Remplacez par votre secret OpenVidu
    const SESSION_NAME = 'machine-learning-session';
    const USER_NAME = 'Étudiant-' + Math.floor(Math.random() * 1000);

    // Variables OpenVidu
    let OV;
    let session;
    let publisher;
    let subscribers = [];
    
    // Variables interface
    let micEnabled = true;
    let videoEnabled = true;
    let startTime = Date.now();

    // Éléments DOM
    const connectionStatus = document.getElementById('connectionStatus');
    const streamContent = document.getElementById('streamContent');
    const participantCount = document.getElementById('participantCount');
    const participantListCount = document.getElementById('participantListCount');
    const participantsList = document.getElementById('participantsList');
    const participantThumbnails = document.getElementById('participantThumbnails');
    const micBtn = document.getElementById('micBtn');
    const videoBtn = document.getElementById('videoBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const timer = document.getElementById('timer');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    // Démarrer la session OpenVidu
    async function initializeSession() {
        try {
            connectionStatus.textContent = 'Connexion en cours...';
            connectionStatus.className = 'connection-status connecting';

            // Initialiser OpenVidu
            OV = new OpenVidu();
            session = OV.initSession();

            // Événements de session
            session.on('streamCreated', (event) => {
                const subscriber = session.subscribe(event.stream, undefined);
                subscribers.push(subscriber);
                addParticipantThumbnail(subscriber);
                updateParticipantCount();
            });

            session.on('streamDestroyed', (event) => {
                removeParticipantThumbnail(event.stream.streamId);
                updateParticipantCount();
            });

            session.on('signal:chat', (event) => {
                addChatMessage(event.from.clientData, event.data);
            });

            // Obtenir le token (en production, cela devrait être fait côté serveur)
            const token = await getToken();
            
            // Se connecter à la session
            await session.connect(token, { clientData: USER_NAME });

            connectionStatus.textContent = 'Connecté';
            connectionStatus.className = 'connection-status connected';
            
            setTimeout(() => {
                connectionStatus.style.display = 'none';
            }, 3000);

            // Initialiser le publisher (caméra locale)
            await initializeLocalStream();

        } catch (error) {
            console.error('Erreur lors de l\'initialisation:', error);
            connectionStatus.textContent = 'Erreur de connexion';
            connectionStatus.className = 'connection-status error';
        }
    }

    // Initialiser le stream local
    async function initializeLocalStream() {
        try {
            publisher = await OV.initPublisherAsync(undefined, {
                audioSource: undefined,
                videoSource: undefined,
                publishAudio: micEnabled,
                publishVideo: videoEnabled,
                resolution: '640x480',
                frameRate: 30,
                insertMode: 'APPEND',
                mirror: false
            });

            // Ajouter la vidéo locale au stream principal
            streamContent.innerHTML = '';
            streamContent.appendChild(publisher.videos[0].video);
            
            // Publier le stream
            session.publish(publisher);

        } catch (error) {
            console.error('Erreur accès caméra/micro:', error);
            streamContent.innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <div class="stream-info">
                    <h2>Erreur caméra/micro</h2>
                    <p>Vérifiez les autorisations</p>
                </div>
            `;
        }
    }

    // Obtenir le token (simplifié pour l'exemple - utilisez votre backend en production)
    async function getToken() {
        // ATTENTION: En production, cette fonction devrait appeler votre backend
        // qui créerait la session et générerait le token de manière sécurisée
        
        try {
            // Créer la session
            const sessionResponse = await fetch(`${OPENVIDU_SERVER_URL}/openvidu/api/sessions`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa('OPENVIDUAPP:' + OPENVIDU_SERVER_SECRET),
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    customSessionId: SESSION_NAME,
                }),
            });

            // Créer le token
            const tokenResponse = await fetch(`${OPENVIDU_SERVER_URL}/openvidu/api/sessions/${SESSION_NAME}/connection`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa('OPENVIDUAPP:' + OPENVIDU_SERVER_SECRET),
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({}),
            });

            const tokenData = await tokenResponse.json();
            return tokenData.token;
        } catch (error) {
            console.error('Erreur lors de la création du token:', error);
            throw error;
        }
    }

    // Ajouter une miniature de participant
    function addParticipantThumbnail(subscriber) {
        const thumbnailDiv = document.createElement('div');
        thumbnailDiv.className = 'thumbnail-item';
        thumbnailDiv.id = 'thumbnail-' + subscriber.stream.streamId;
        
        thumbnailDiv.innerHTML = `
            <div class="thumbnail-overlay">
                <span class="thumbnail-name">${subscriber.stream.connection.data.split('%')[0] || 'Participant'}</span>
                <div class="participant-status">
                    <i class="fas fa-microphone" style="color: var(--secondary); font-size: 0.8rem;"></i>
                </div>
            </div>
        `;
        
        subscriber.addVideoElement(thumbnailDiv);
        participantThumbnails.appendChild(thumbnailDiv);

        // Ajouter à la liste des participants
        const participantItem = document.createElement('div');
        participantItem.className = 'participant-item';
        participantItem.id = 'participant-' + subscriber.stream.streamId;
        participantItem.innerHTML = `
            <div class="participant-avatar" style="background: var(--secondary); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-user" style="color: white;"></i>
            </div>
            <span>${subscriber.stream.connection.data.split('%')[0] || 'Participant'}</span>
        `;
        participantsList.appendChild(participantItem);
    }

    // Supprimer une miniature de participant
    function removeParticipantThumbnail(streamId) {
        const thumbnail = document.getElementById('thumbnail-' + streamId);
        const participant = document.getElementById('participant-' + streamId);
        
        if (thumbnail) thumbnail.remove();
        if (participant) participant.remove();
    }

    // Mettre à jour le compteur de participants
    function updateParticipantCount() {
        const count = subscribers.length + 1; // +1 pour l'utilisateur local
        participantCount.textContent = `${count} participant${count > 1 ? 's' : ''}`;
        participantListCount.textContent = count;
    }

    // Contrôles audio/vidéo
    micBtn.addEventListener('click', () => {
        micEnabled = !micEnabled;
        publisher.publishAudio(micEnabled);
        micBtn.classList.toggle('active');
        
        const icon = micBtn.querySelector('i');
        if (micEnabled) {
            icon.className = 'fas fa-microphone control-icon';
        } else {
            icon.className = 'fas fa-microphone-slash control-icon';
        }
    });

    videoBtn.addEventListener('click', () => {
        videoEnabled = !videoEnabled;
        publisher.publishVideo(videoEnabled);
        videoBtn.classList.toggle('active');
        
        const icon = videoBtn.querySelector('i');
        if (videoEnabled) {
            icon.className = 'fas fa-video control-icon';
        } else {
            icon.className = 'fas fa-video-slash control-icon';
        }
    });

    // Quitter la session
    leaveBtn.addEventListener('click', () => {
        if (session) {
            session.disconnect();
        }
        window.location.href = '/'; // Rediriger vers la page d'accueil
    });

    // Chat
    function addChatMessage(sender, message) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'chat-message';
        
        const time = new Date().toLocaleTimeString('fr-FR', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });
        
        messageDiv.innerHTML = `
            <div class="message-avatar" style="background: var(--primary); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-user" style="color: white; font-size: 0.8rem;"></i>
            </div>
            <div class="message-content">
                <div class="message-sender">${sender || 'Participant'}</div>
                <div>${message}</div>
                <div class="message-time">${time}</div>
            </div>
        `;
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
        const message = chatInput.value.trim();
        if (message && session) {
            session.signal({
                type: 'chat',
                data: message,
                to: []
            });
            
            // Ajouter le message localement
            addChatMessage('Vous', message);
            chatInput.value = '';
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Timer de la réunion
    function updateTimer() {
        const elapsed = Date.now() - startTime;
        const hours = Math.floor(elapsed / 3600000);
        const minutes = Math.floor((elapsed % 3600000) / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        
        timer.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    setInterval(updateTimer, 1000);

    // Partage d'écran
    document.getElementById('screenBtn').addEventListener('click', async () => {
        try {
            if (publisher && publisher.stream && publisher.stream.getMediaStream()) {
                const videoTrack = publisher.stream.getMediaStream().getVideoTracks()[0];
                if (videoTrack && videoTrack.label && videoTrack.label.includes('screen')) {
                    // Arrêter le partage d'écran, revenir à la caméra
                    const newPublisher = await OV.initPublisherAsync(undefined, {
                        audioSource: undefined,
                        videoSource: undefined,
                        publishAudio: micEnabled,
                        publishVideo: videoEnabled,
                        resolution: '640x480',
                        frameRate: 30,
                        insertMode: 'APPEND',
                        mirror: false
                    });

                    await session.unpublish(publisher);
                    publisher = newPublisher;
                    streamContent.innerHTML = '';
                    streamContent.appendChild(publisher.videos[0].video);
                    await session.publish(publisher);

                    document.getElementById('screenBtn').classList.remove('active');
                } else {
                    // Démarrer le partage d'écran
                    const screenPublisher = await OV.initPublisherAsync(undefined, {
                        audioSource: false,
                        videoSource: 'screen',
                        publishAudio: micEnabled,
                        publishVideo: true,
                        insertMode: 'APPEND'
                    });

                    await session.unpublish(publisher);
                    publisher = screenPublisher;
                    streamContent.innerHTML = '';
                    streamContent.appendChild(publisher.videos[0].video);
                    await session.publish(publisher);

                    document.getElementById('screenBtn').classList.add('active');
                }
            }
        } catch (error) {
            console.error('Erreur partage d\'écran:', error);
        }
    });

    // Gestion des erreurs de session
    session.on('exception', (exception) => {
        console.warn('Exception OpenVidu:', exception);
    });

    session.on('sessionDisconnected', (event) => {
        console.log('Session déconnectée:', event.reason);
        connectionStatus.textContent = 'Session déconnectée';
        connectionStatus.className = 'connection-status error';
        connectionStatus.style.display = 'block';
    });

    // Messages de chat prédéfinis pour la démo
    function addDemoMessages() {
        setTimeout(() => {
            addChatMessage('Dr. Sarah Chen', 'Bonjour à tous! Bienvenue dans notre session sur le Machine Learning avancé.');
        }, 2000);
        
        setTimeout(() => {
            addChatMessage('Emma Rodriguez', 'Merci professeur! J\'ai hâte de commencer.');
        }, 4000);
        
        setTimeout(() => {
            addChatMessage('Thomas Martin', 'Est-ce que les supports de cours seront disponibles après la session?');
        }, 6000);
    }

    // Initialiser l'application
    window.addEventListener('load', () => {
        initializeSession();
        addDemoMessages();
    });

    // Nettoyage à la fermeture de la page
    window.addEventListener('beforeunload', () => {
        if (session) {
            session.disconnect();
        }
    });
    </script>

</body>
</html>
